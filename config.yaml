ccbc:
  max_iter: 300
  tol: 1.0e-4
  n_starts: 5

ga:
  pop_size: 30       # Prins (2004): σ=30 optimal; larger hurts due to unproductive crossovers
  n_gen: 200        # ~30,000 crossovers / σ=30 per Prins (2004) Christofides setting
  seed: 42
  mutation_prob: 0.15 # Prins (2004): pm up to 0.20; higher rate is fine with LS mutation
  local_search_max_iterations: 100
  clone_delta: 1   # Vidal (2012): well-spaced spacing; two solutions are clones if floor(F/delta) matches
  stagnation_period: 10   # sliding window size for early stopping (pymoo ftol period)
  stagnation_ftol: 1e-6   # absolute fitness tolerance; stop if best doesn't improve by this over stagnation_period gens
  time_limit: "00:05:00"  # per-depot GA wall-clock limit (HH:MM:SS); acts as a hard cap alongside n_gen and stagnation
