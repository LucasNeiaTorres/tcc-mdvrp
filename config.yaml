ccbc:
  max_iter: 300
  tol: 1.0e-4
  n_starts: 5

ga:
  pop_size: 30       # Prins (2004): σ=30 optimal; larger hurts due to unproductive crossovers
  n_gen: 200        # ~30,000 crossovers / σ=30 per Prins (2004) Christofides setting
  seed: 42
  mutation_prob: 0.15 # Prins (2004): pm up to 0.20; higher rate is fine with LS mutation

simulation:
  reroute_degradation_threshold: 1.20  # Stage-1 acceptance limit for reroute cost (e.g., 1.10 = +10%)
  cluster_degradation_threshold: 1.10  # Stage-2 cluster acceptance limit for cluster cost (e.g., 1.05 = +5%)
  penalty_overcapacity_per_unit: 100000.0   # Soft-constraint penalty (capacity excess units)
  penalty_overtime_per_minute: 50000.0     # Soft-constraint penalty (shift overtime minutes)
